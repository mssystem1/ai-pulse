openapi: 3.1.0
info:
  title: PULSE Circle Agent Marketplace API
  version: current
  description: >-
    Five focused x402 services on Arc Mainnet: two Global Market reports, two
    Prediction Market reports and one Onchain Pre-Trade Risk Guard. Payments
    use USDC through Circle Gateway. The research catalog publishes five mainnet services; Arc execution requires qualified PULSE deployments.
    Spot execution, Autopilot execution and per-vault Autopilot AI passes are
    deliberately outside this five-service marketplace contract.
  contact:
    url: https://www.ai-pulse.tech
  license:
    name: MIT
    identifier: MIT
externalDocs:
  description: PULSE source repository
  url: https://github.com/mssystem1/ai-pulse
servers:
  - url: https://pulse-api-production-7aae.up.railway.app
    description: Production API origin; Arc routes use Arc Mainnet payments
tags:
  - name: Global Market
  - name: Prediction analysis
  - name: Risk Guard
paths:
  /arc/v1/analysis/spot/standard:
    post:
      operationId: createArcSpotStandardReport
      summary: Global Quick to Spot Market or Limit
      description: >-
        Global Quick with 520 completed OHLCV candles, selected primary timeframe,
        conditional main and alternative moves, and one aligned Spot plan.
        Returns a recoverable job; poll its free GET endpoints and deliver all
        reportMarkdown sections plus the canonical report.global chart data.
        Elliott count is shown only when supported; otherwise Count unclear.
      tags: [Global Market]
      x-pulse-price-usd: 0.20
      x-x402-network: eip155:5042
      x-x402-asset: "0x3600000000000000000000000000000000000000"
      x-x402-provider: circle-gateway
      requestBody:
        $ref: "#/components/requestBodies/SpotRequest"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "402":
          $ref: "#/components/responses/PaymentRequired"
  /arc/v1/analysis/spot/premium:
    post:
      operationId: createArcSpotPremiumReport
      summary: Global Pro to Spot Market or Limit
      description: >-
        Global Pro adds independently observed higher-timeframe context, SMA
        family, regression channel, anchored VWAP, Fibonacci, confirmed pivots,
        RSI and ATR evidence to the same aligned Spot plan. Context follows the
        chosen timeframe. Conditional moves and unclear Elliott counts are
        labelled explicitly. Poll the free job endpoints for the full Markdown
        and canonical report.global chart data; an accepted job is not delivery.
      tags: [Global Market]
      x-pulse-price-usd: 0.30
      x-x402-network: eip155:5042
      x-x402-asset: "0x3600000000000000000000000000000000000000"
      x-x402-provider: circle-gateway
      requestBody:
        $ref: "#/components/requestBodies/SpotRequest"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "402":
          $ref: "#/components/responses/PaymentRequired"
  /arc/v1/analysis/prediction/standard:
    post:
      operationId: createArcPredictionStandardReport
      summary: Prediction Quick
      tags: [Prediction analysis]
      x-pulse-price-usd: 0.20
      x-x402-network: eip155:5042
      x-x402-asset: "0x3600000000000000000000000000000000000000"
      x-x402-provider: circle-gateway
      requestBody:
        $ref: "#/components/requestBodies/PredictionRequest"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "402":
          $ref: "#/components/responses/PaymentRequired"
  /arc/v1/analysis/prediction/premium:
    post:
      operationId: createArcPredictionPremiumReport
      summary: Prediction Pro
      tags: [Prediction analysis]
      x-pulse-price-usd: 0.30
      x-x402-network: eip155:5042
      x-x402-asset: "0x3600000000000000000000000000000000000000"
      x-x402-provider: circle-gateway
      requestBody:
        $ref: "#/components/requestBodies/PredictionRequest"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "402":
          $ref: "#/components/responses/PaymentRequired"
  /arc/v1/preflight:
    post:
      operationId: createArcOnchainRiskGuard
      summary: Onchain Pre-Trade Risk Guard
      description: Deeper PASS/WARN/FAIL review of a token, route, amount or counterparty before an on-chain action.
      tags: [Risk Guard]
      x-pulse-price-usd: 0.20
      x-x402-network: eip155:5042
      x-x402-asset: "0x3600000000000000000000000000000000000000"
      x-x402-provider: circle-gateway
      requestBody:
        $ref: "#/components/requestBodies/RiskGuardRequest"
      responses:
        "200":
          description: Risk Guard report
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "402":
          $ref: "#/components/responses/PaymentRequired"
  /v1/jobs/{jobId}:
    get:
      operationId: getResearchJob
      summary: Free private job status
      description: Poll every three seconds until completed or completed_partial. Report any failure explicitly; never repay an accepted job.
      security: [{ ReportRecovery: [] }]
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Current job stage
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "403":
          description: Invalid or missing recovery token
  /v1/jobs/{jobId}/report:
    get:
      operationId: getCompletedResearchReport
      summary: Free private full report recovery
      description: >-
        Returns report, reportMarkdown and delivery. Present every Markdown
        section. Global reports include canonical report.global OHLCV,
        indicators, conditional paths and the aligned setup for chart rendering.
        HTTP 409 means continue polling; storage 503 means retry this GET.
      security: [{ ReportRecovery: [] }]
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Original purchased report snapshot
          content:
            application/json:
              schema:
                type: object
                required: [report, reportMarkdown, delivery]
                properties:
                  report:
                    type: object
                    additionalProperties: true
                  reportMarkdown:
                    type: string
                    description: Full readable deliverable; present every section.
                  delivery:
                    type: object
                    additionalProperties: true
                additionalProperties: true
        "403":
          description: Invalid or missing recovery token
        "409":
          description: Report not yet ready
        "503":
          description: Temporary storage failure; retry GET without another payment
components:
  securitySchemes:
    ReportRecovery:
      type: apiKey
      in: header
      name: PULSE-RECOVERY-TOKEN
  parameters:
    JobId:
      in: path
      name: jobId
      required: true
      schema: { type: string, format: uuid }
  requestBodies:
    SpotRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SpotRequest"
          examples:
            bitcoinHourly:
              value:
                instId: BTC-USDT
                timeframe: 1H
                lang: en
    PredictionRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PredictionRequest"
          examples:
            selectedMarket:
              value:
                primaryMarketId: "pm:0x8717c39520cadcb8ad6f88af148c30acf7d044c92a9cf48416b9b9a5ed65d6d8"
                additionalMarketIds: []
                lang: en
    RiskGuardRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RiskGuardRequest"
          examples:
            tokenBeforeTrade:
              value:
                tokenAddress: "0x3600000000000000000000000000000000000000"
                chainId: "5042"
                lang: en
  schemas:
    SpotRequest:
      type: object
      additionalProperties: false
      required: [instId, timeframe, lang]
      properties:
        instId:
          type: string
          minLength: 3
          maxLength: 32
          examples: [BTC-USDT]
        timeframe:
          type: string
          enum: [1m, 3m, 5m, 15m, 30m, 1H, 2H, 4H, 6H, 12H, 1D, 1W, 1Dutc, 1Wutc]
          examples: [15m, 1H, 4H, 1D, 1W]
        lang:
          type: string
          enum: [en, zh]
        userNote:
          type: string
          maxLength: 500
    PredictionRequest:
      type: object
      additionalProperties: false
      required: [primaryMarketId, lang]
      properties:
        primaryMarketId:
          type: string
          description: Select an active orderbook-enabled market from /v1/polymarket/markets and verify its detail immediately before payment. Examples are historical snapshots, not guaranteed active markets.
          minLength: 1
          maxLength: 256
        additionalMarketIds:
          type: array
          maxItems: 7
          default: []
          items:
            type: string
            minLength: 1
            maxLength: 256
        lang:
          type: string
          enum: [en, zh]
        userNote:
          type: string
          maxLength: 500
    RiskGuardRequest:
      type: object
      additionalProperties: false
      required: [tokenAddress, lang]
      properties:
        lang:
          type: string
          enum: [en, zh]
        chainId:
          type: string
          const: "5042"
        intent:
          type: string
          enum: [swap, transfer, approve, hire_agent, generic]
          default: generic
        tokenAddress:
          type: string
          pattern: "^0x[a-fA-F0-9]{40}$"
        walletAddress:
          type: string
          pattern: "^0x[a-fA-F0-9]{40}$"
        counterparty:
          type: string
          pattern: "^0x[a-fA-F0-9]{40}$"
        fromToken:
          type: string
          pattern: "^0x[a-fA-F0-9]{40}$"
        toToken:
          type: string
          pattern: "^0x[a-fA-F0-9]{40}$"
        amount:
          type: string
        notes:
          type: string
          maxLength: 500
    JobAccepted:
      type: object
      description: Durable paid job accepted for asynchronous processing.
      required: [job, recoveryToken, pollUrl, reportUrl, delivery]
      properties:
        job:
          type: object
          additionalProperties: true
          properties:
            id:
              type: string
              format: uuid
            stage:
              type: string
        recoveryToken:
          type: string
          description: Private capability sent in PULSE-RECOVERY-TOKEN; never publish it or pay again to retrieve the report.
        pollUrl:
          type: string
        reportUrl:
          type: string
        delivery:
          type: object
          additionalProperties: true
        replay:
          type: boolean
    Error:
      type: object
      additionalProperties: true
      properties:
        error:
          type: string
  responses:
    JobAccepted:
      description: Payment accepted and durable report job created or recovered.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JobAccepted"
    BadRequest:
      description: Invalid input or unavailable required market evidence.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PaymentRequired:
      description: >-
        x402 payment challenge for Arc Mainnet USDC through Circle Gateway.
        Payment requirements are returned in the standard payment-required headers and body.
      headers:
        PAYMENT-REQUIRED:
          description: Base64-encoded x402 payment requirements when supplied by the server.
          schema:
            type: string
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
