openapi: 3.1.0
info:
  title: PULSE Circle Agent Marketplace API
  version: 6.1.0
  description: >-
    Five focused x402 services on Arc Testnet: two Global Market reports, two
    Prediction Market reports and one Onchain Pre-Trade Risk Guard. Payments
    use test USDC through Circle Gateway. Arc Testnet is analysis/payment only.
    Spot execution, Autopilot execution and per-vault Autopilot AI passes are
    deliberately outside this five-service marketplace contract.
  contact:
    url: https://www.ai-pulse.tech
  license:
    name: MIT
    identifier: MIT
externalDocs:
  description: PULSE source repository
  url: https://github.com/mssystem1/ai-pulse
servers:
  - url: https://pulse-api-production-7aae.up.railway.app
    description: Production API origin; Arc routes use Arc Testnet payments
tags:
  - name: Global Market
  - name: Prediction analysis
  - name: Risk Guard
paths:
  /arc/v1/analysis/spot/standard:
    post:
      operationId: createArcSpotStandardReport
      summary: Global Market Quick Plan
      tags: [Global Market]
      x-pulse-price-usd: 0.20
      x-x402-network: eip155:5042002
      x-x402-asset: "0x3600000000000000000000000000000000000000"
      x-x402-provider: circle-gateway
      requestBody:
        $ref: "#/components/requestBodies/SpotRequest"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "402":
          $ref: "#/components/responses/PaymentRequired"
  /arc/v1/analysis/spot/premium:
    post:
      operationId: createArcSpotPremiumReport
      summary: Global Market Pro Strategy
      tags: [Global Market]
      x-pulse-price-usd: 0.30
      x-x402-network: eip155:5042002
      x-x402-asset: "0x3600000000000000000000000000000000000000"
      x-x402-provider: circle-gateway
      requestBody:
        $ref: "#/components/requestBodies/SpotRequest"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "402":
          $ref: "#/components/responses/PaymentRequired"
  /arc/v1/analysis/prediction/standard:
    post:
      operationId: createArcPredictionStandardReport
      summary: Prediction Market Quick View
      tags: [Prediction analysis]
      x-pulse-price-usd: 0.20
      x-x402-network: eip155:5042002
      x-x402-asset: "0x3600000000000000000000000000000000000000"
      x-x402-provider: circle-gateway
      requestBody:
        $ref: "#/components/requestBodies/PredictionRequest"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "402":
          $ref: "#/components/responses/PaymentRequired"
  /arc/v1/analysis/prediction/premium:
    post:
      operationId: createArcPredictionPremiumReport
      summary: Prediction Market Pro Analysis
      tags: [Prediction analysis]
      x-pulse-price-usd: 0.30
      x-x402-network: eip155:5042002
      x-x402-asset: "0x3600000000000000000000000000000000000000"
      x-x402-provider: circle-gateway
      requestBody:
        $ref: "#/components/requestBodies/PredictionRequest"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "402":
          $ref: "#/components/responses/PaymentRequired"
  /arc/v1/preflight:
    post:
      operationId: createArcOnchainRiskGuard
      summary: Onchain Pre-Trade Risk Guard
      description: Deeper PASS/WARN/FAIL review of a token, route, amount or counterparty before an on-chain action.
      tags: [Risk Guard]
      x-pulse-price-usd: 0.15
      x-x402-network: eip155:5042002
      x-x402-asset: "0x3600000000000000000000000000000000000000"
      x-x402-provider: circle-gateway
      requestBody:
        $ref: "#/components/requestBodies/RiskGuardRequest"
      responses:
        "200":
          description: Risk Guard report
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "402":
          $ref: "#/components/responses/PaymentRequired"
components:
  requestBodies:
    SpotRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SpotRequest"
          examples:
            bitcoinHourly:
              value:
                instId: BTC-USDT
                timeframe: 1H
                lang: en
    PredictionRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PredictionRequest"
          examples:
            selectedMarket:
              value:
                primaryMarketId: "POLYMARKET_MARKET_ID"
                additionalMarketIds: []
                lang: en
    RiskGuardRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RiskGuardRequest"
          examples:
            tokenBeforeTrade:
              value:
                intent: swap
                tokenAddress: "0x0000000000000000000000000000000000000001"
                amount: "1"
  schemas:
    SpotRequest:
      type: object
      additionalProperties: false
      required: [instId]
      properties:
        instId:
          type: string
          minLength: 3
          maxLength: 32
          examples: [BTC-USDT]
        timeframe:
          type: string
          default: 1H
          examples: [15m, 1H, 4H, 1D, 1W]
        lang:
          type: string
          enum: [en, zh]
          default: en
        userNote:
          type: string
          maxLength: 500
    PredictionRequest:
      type: object
      additionalProperties: false
      required: [primaryMarketId]
      properties:
        primaryMarketId:
          type: string
          minLength: 1
          maxLength: 256
        additionalMarketIds:
          type: array
          maxItems: 7
          default: []
          items:
            type: string
            minLength: 1
            maxLength: 256
        lang:
          type: string
          enum: [en, zh]
          default: en
        userNote:
          type: string
          maxLength: 500
    RiskGuardRequest:
      type: object
      additionalProperties: false
      properties:
        intent:
          type: string
          enum: [swap, transfer, approve, hire_agent, generic]
          default: generic
        tokenAddress:
          type: string
          pattern: "^0x[a-fA-F0-9]{40}$"
        walletAddress:
          type: string
          pattern: "^0x[a-fA-F0-9]{40}$"
        counterparty:
          type: string
          pattern: "^0x[a-fA-F0-9]{40}$"
        fromToken:
          type: string
          pattern: "^0x[a-fA-F0-9]{40}$"
        toToken:
          type: string
          pattern: "^0x[a-fA-F0-9]{40}$"
        amount:
          type: string
        notes:
          type: string
          maxLength: 500
    JobAccepted:
      type: object
      description: Durable paid job accepted for asynchronous processing.
      required: [job]
      properties:
        job:
          type: object
          additionalProperties: true
          properties:
            id:
              type: string
              format: uuid
            state:
              type: string
            recoveryToken:
              type: string
              description: Private capability used to poll and recover the report without repaying.
        replay:
          type: boolean
    Error:
      type: object
      additionalProperties: true
      properties:
        error:
          type: string
  responses:
    JobAccepted:
      description: Payment accepted and durable report job created or recovered.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JobAccepted"
    BadRequest:
      description: Invalid input or unavailable required market evidence.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PaymentRequired:
      description: >-
        x402 payment challenge for Arc Testnet test USDC through Circle Gateway.
        Payment requirements are returned in the standard payment-required headers and body.
      headers:
        PAYMENT-REQUIRED:
          description: Base64-encoded x402 payment requirements when supplied by the server.
          schema:
            type: string
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
